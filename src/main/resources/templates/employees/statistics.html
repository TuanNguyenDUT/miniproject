<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Employee Statistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/employees}">Employee Management</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/employees}">Back to Employees</a>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Employee Reporting &amp; Analytics</h2>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-bg-primary shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-uppercase">Total Employees</h6>
                    <p class="display-5 mb-0" th:text="${statistics.totalEmployees}">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Employees by Department</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Department</th>
                    <th>Employee Count</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="stat : ${statistics.departmentStatistics}">
                    <td th:text="${stat.departmentName}">Department</td>
                    <td th:text="${stat.employeeCount}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(statistics.departmentStatistics)}">
                    <td colspan="2" class="text-center text-muted py-3">No department data available.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
