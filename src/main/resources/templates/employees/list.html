<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Employees - Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/employees}">Employee Management</a>
        <div class="d-flex align-items-center gap-3">
            <a class="btn btn-outline-light btn-sm" th:href="@{/employees/statistics}">Statistics</a>
            <span class="text-light small" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-warning btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Employees</h2>
            <small class="text-muted">Total employees (cached 1m): <strong th:text="${totalEmployees}">0</strong></small>
        </div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/employees/new}" class="btn btn-primary">+ Add Employee</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/employees}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by name or email..."/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
            <a th:href="@{/employees}" class="btn btn-outline-light text-dark border">Reset</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Position</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th sec:authorize="hasRole('ADMIN')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employeePage.content}">
                    <td th:text="${emp.id}">1</td>
                    <td th:text="${emp.name}">Name</td>
                    <td th:text="${emp.email}">Email</td>
                    <td th:text="${emp.phone}">Phone</td>
                    <td th:text="${emp.position}">Position</td>
                    <td th:text="${emp.departmentName != null ? emp.departmentName : '-'}">Department</td>
                    <td th:text="${#numbers.formatDecimal(emp.salary, 1, 'COMMA', 0, 'POINT')}">0</td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                           onclick="return confirm('Delete this employee?')"
                           class="btn btn-sm btn-outline-danger">Delete</a>
                    </td>
                </tr>
                <tr th:if="${employeePage.empty}">
                    <td colspan="8" class="text-center py-4 text-muted">No employees found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${employeePage.totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, employeePage.totalPages - 1)}"
                th:classappend="${i == employeePage.number} ? 'active'">
                <a class="page-link" th:href="@{/employees(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
